[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nse-fo-ban-and-mwpl"
version = "0.1.0"
description = "NSE daily F&O ban period securities, consecutive days in ban, and MWPL breach tracker"
authors = [{ name = "Prathmesh Gupta" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28.0",
    "pandas>=2.0.0",
    "pyarrow>=14.0.0",
    "numpy>=1.24.0"
]

[tool.setuptools.packages.find]
where = ["src"]
